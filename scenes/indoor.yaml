scenes:
  provocative:
    couch_sitting:
      subtitle: Sitting on Couch
      environment: living room couch
      triggers: [couch, sofa, "on the couch", "sit down"]
      exit_triggers: ["get up", "stand up", "leave the couch"]
      entry: settles onto the couch
      default_activity: lounging
      activities:
        lounging:
          description: lounging back lazily
          triggers: [relax, lounge, comfy]
          selection: random
          poses: [couch_sprawl, couch_curl, couch_legs_up, couch_hands_raised]
        attentive:
          description: leaning in to talk
          triggers: [talk, listen, close]
          selection: random
          poses: [couch_lean_in, couch_cross, couch_knees_wide, couch_knee_on_cushion]
      poses:
        - id: couch_sprawl
          name: Lazy Sprawl
          posture: seated
          description: Sinks into the cushions with one arm draped along the backrest.
          body: reclined, back against cushion, chest open
          legs: knees apart slightly, one foot flat, other stretched out
          arms: right arm along backrest, left resting on thigh
          hands: fingers relaxed, loosely curled
          head: tilted back slightly, gaze lowered toward viewer
          expression: lazy half-smile
          props: [cushion]
          image_prompt: sitting on couch, reclined, arm along backrest, relaxed sprawl, one leg extended
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [sprawl, lazy]
        - id: couch_curl
          name: Curled Up
          posture: seated
          description: Tucks both legs beneath her and leans sideways into the armrest.
          body: angled sideways, shoulder against armrest
          legs: both legs folded beneath, feet tucked
          arms: one arm hugging a cushion
          hands: fingers gripping cushion edge
          head: resting toward shoulder, eyes looking up
          expression: soft, shy smile
          props: [cushion, armrest]
          image_prompt: curled up on couch, legs tucked, hugging cushion, leaning on armrest
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [curl, cozy]
        - id: couch_legs_up
          name: Legs Over Arm
          posture: seated
          description: Sits sideways with both legs swung over the armrest.
          body: leaning back, torso twisted slightly
          legs: both legs draped over armrest, ankles crossed
          arms: hands behind head
          hands: fingers laced behind head
          head: tipped back, chin raised
          expression: playful smirk
          props: [armrest]
          image_prompt: sitting sideways on couch, legs over armrest, hands behind head, ankles crossed
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [legs, drape]
        - id: couch_lean_in
          name: Leaning In
          posture: seated
          description: Perches on the cushion edge and leans forward toward the viewer.
          body: torso forward, back arched slightly
          legs: knees together, feet flat
          arms: forearms on thighs
          hands: fingers clasped between knees
          head: chin lowered, eyes up
          expression: intent, teasing
          props: []
          image_prompt: sitting on couch edge, leaning forward, forearms on knees, looking up
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [lean, closer]
        - id: couch_cross
          name: Legs Crossed
          posture: seated
          description: Sits upright with one leg crossed over the other, one hand resting on the cushion beside her.
          body: upright, shoulders back
          legs: crossed at knee, top foot pointed
          arms: one hand on knee, other on cushion
          hands: fingertips lightly tracing fabric
          head: turned over shoulder, eyes sideways
          expression: coy
          props: []
          image_prompt: sitting on couch, legs crossed, upright posture, glancing sideways
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [cross, poised]
        - id: couch_knees_wide
          name: Wide Knees
          posture: seated
          description: Sits on the couch leaning slightly forward with knees wide apart and a hand on each thigh.
          body: leaning slightly forward, spine upright, shoulders square
          legs: knees wide apart, feet planted flat and apart
          arms: both arms extended down to the thighs
          hands: one hand on each thigh, fingers spread
          head: chin level, gaze direct
          expression: confident, intent
          props: [couch]
          image_prompt: sitting on couch, knees wide apart, feet flat, hands on thighs, leaning forward, direct gaze
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [wide, thighs]
        - id: couch_hands_raised
          name: Hands Beside Head
          posture: seated
          description: Sits back on the couch with legs stretched out wide and both hands raised beside her head.
          body: leaning back slightly, spine straight
          legs: knees apart, legs stretched out wide, feet extended
          arms: both elbows bent, hands raised to head height
          hands: open palms facing inward beside the head
          head: chin level, looking forward
          expression: animated, expressive
          props: [couch]
          image_prompt: sitting on couch, legs stretched wide, both hands raised beside head, expressive
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [raised, gesture]
        - id: couch_knee_on_cushion
          name: Knee on Cushion
          posture: kneeling
          description: Leans forward over the couch with one knee on the cushion and arms braced, looking back at the viewer.
          body: leaning forward over the backrest, back slightly arched, torso angled
          legs: one knee on the cushion, other leg straight with heel lifted
          arms: one arm braced on the backrest, other on the armrest
          hands: palms gripping the couch back
          head: turned over shoulder, gaze direct
          expression: coy, direct
          props: [couch, backrest]
          image_prompt: leaning over couch, one knee on cushion, hands on backrest, looking over shoulder
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [cushion, backrest]

    chair_sitting:
