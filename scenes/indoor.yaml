        casual:
          description: slouching or leaning back
          triggers: [slouch, relax, tilt]
          selection: random
          poses: [chair_tilt, chair_sideways, chair_legs_raised, chair_feet_on_desk, chair_wide_grip]
      poses:
        - id: chair_upright
          name: Upright Poise
          posture: seated
          description: Sits tall with spine straight and hands folded in her lap.
          body: upright, shoulders back, chin level
          legs: knees together, feet flat
          arms: elbows close, forearms in lap
          hands: fingers interlaced on lap
          head: level, gaze direct
          expression: calm, composed
