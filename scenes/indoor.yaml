          image_prompt: sitting on edge of chair, leaning forward, hands on knees, looking up
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [edge, forward]
        - id: chair_tilt
          name: Tilted Back
          posture: seated
          description: Leans back with the chair tilted and one foot propped.
          body: reclined, relaxed shoulders
          legs: one foot propped on edge of table or rung, other extended
          arms: hands behind head
          hands: fingers laced behind head
          head: tilted back, eyes half-lidded
          expression: lazy confidence
          props: [chair]
          image_prompt: leaning back in chair, hands behind head, foot propped, relaxed
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [tilt, lean back]
        - id: chair_sideways
          name: Sideways Sit
          posture: seated
          description: Sits sideways with both legs draped over the chair arm.
          body: twisted, back against the other arm
          legs: both legs over armrest, ankles crossed
          arms: one arm along backrest
          hands: fingers trailing loosely
          head: turned toward viewer, gaze playful
          expression: mischievous grin
          props: [chair]
          image_prompt: sitting sideways in chair, legs over armrest, arm along backrest
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [sideways, drape]
        - id: chair_legs_raised
          name: Legs Raised
          posture: seated
          description: Reclines deeply in the chair with one leg lifted high and the other knee bent.
          body: reclined deep into chair, torso angled
          legs: one leg raised high in the air, other knee bent with foot on desk edge
          arms: one hand resting on raised thigh
          hands: fingers resting on thigh
          head: tilted, gaze direct
          expression: smoldering, confident
          props: [office chair, desk]
          image_prompt: reclined in office chair, one leg raised high, other knee bent, hand on thigh, head tilted
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [raised, reclined]
        - id: chair_feet_on_desk
          name: Feet on Desk
          posture: seated
          description: Reclines in the chair with both legs extended and heels resting on the desk.
          body: reclined, shoulders relaxed, torso angled toward viewer
          legs: both legs fully extended, heels resting on desk
          arms: arms bent in front of lap
          hands: both hands holding at her waist
          head: tilted, eyes direct
          expression: playful, knowing smile
          props: [office chair, desk]
          image_prompt: reclined in office chair, both legs extended, heels on desk, hands at waist, smiling
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [feet, desk]
        - id: chair_wide_grip
          name: Gripping the Seat
          posture: seated
          description: Sits in a low chair with knees wide, torso leaning slightly forward and hands gripping the seat edges.
          body: leaning slightly forward, shoulders drawn in
          legs: knees wide apart, feet planted flat and apart
          arms: both arms down and in, elbows slightly bent
          hands: fingers gripping the seat edge beside the hips
          head: tilted, chin lowered, eyes up
          expression: coy smirk
          props: [chair]
          image_prompt: sitting in low chair, knees wide, hands gripping seat edges, leaning forward, chin down, looking up
          negative_prompt: extra limbs, bad hands, deformed, nudity, explicit
          triggers: [grip, wide]

