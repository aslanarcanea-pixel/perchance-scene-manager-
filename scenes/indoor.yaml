          image_prompt: sitting on chair, upright posture, hands folded in lap, knees together
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [upright, formal]
        - id: chair_cross
          name: Crossed Legs
          posture: seated
          description: Crosses her legs and rests one elbow on the chair arm.
          body: leaning slightly to one side
          legs: crossed at knee, foot dangling
          arms: elbow on armrest
          hands: chin resting on fingertips
          head: tilted, gaze steady
          expression: thoughtful smirk
          props: [chair]
          image_prompt: sitting on chair, legs crossed, elbow on armrest, chin on hand
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [cross, elbow]
        - id: chair_perch
          name: Edge Perch
          posture: seated
          description: Perches on the front edge with her torso angled forward.
          body: leaning forward, back arched
          legs: knees apart slightly, heels lifted
          arms: hands braced on knees
          hands: palms flat on knees
          head: chin down, eyes up
          expression: eager, teasing
