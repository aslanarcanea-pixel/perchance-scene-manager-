          selection: random
          poses: [floor_tall, floor_sit_heels, floor_one_knee]
        low_kneel:
          description: kneeling low or leaning
          triggers: [low, lean, crawl]
          selection: random
          poses: [floor_hands_knees, floor_side_sit]
