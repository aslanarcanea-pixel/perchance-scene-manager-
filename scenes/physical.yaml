        - id: floor_tall
          name: Tall Kneel
          posture: kneeling
          description: Kneels tall with thighs vertical and hands on her thighs.
          body: upright, hips over knees, shoulders back
          legs: knees hip-width apart, tops of feet on floor
          arms: relaxed at sides
          hands: palms resting on thighs
          head: chin level, eyes forward
          expression: calm, attentive
          props: []
          image_prompt: kneeling upright on floor, hands on thighs, back straight
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [tall, upright]
        - id: floor_sit_heels
          name: Sitting on Heels
          posture: kneeling
          description: Sits back on her heels with hands folded in her lap.
          body: sitting low, back straight
          legs: knees together, feet beneath
          arms: forearms in lap
          hands: fingers interlaced
          head: slightly bowed, eyes lifted
          expression: demure
          props: []
          image_prompt: kneeling sitting on heels, hands in lap, knees together
          negative_prompt: extra limbs, bad hands, deformed, nudity
          triggers: [heels, sit back]
        - id: floor_one_knee
